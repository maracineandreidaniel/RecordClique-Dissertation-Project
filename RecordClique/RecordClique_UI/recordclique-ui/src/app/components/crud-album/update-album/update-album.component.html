<div class="container my-5">
    <h1 class="mb-3">Update Screening</h1>
    <div class="row">
      <div class="col-6">
        <form [formGroup]="updateAlbumForm" (ngSubmit)="updateAlbum()">
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Title</mat-label>
            <input matInput type="text" formControlName="title">
          </mat-form-field>
  
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Description</mat-label>
            <textarea matInput rows="5" formControlName="description"></textarea>
          </mat-form-field>
  
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Cover</mat-label>
            <textarea matInput rows="5" formControlName="cover"></textarea>
          </mat-form-field>
  
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Release Date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="releaseDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
  
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Genres</mat-label>
            <mat-select formControlName="genres" multiple>
              <mat-option *ngFor="let genre of genresOptions" [value]="genre.Id">{{ genre.Value }}</mat-option>
            </mat-select>
          </mat-form-field>
          
          <mat-form-field appearance="fill" class="w-100 mb-3">
            <mat-label>Artists</mat-label>
            <mat-select formControlName="artists" multiple>
              <mat-option *ngFor="let artist of artistsOptions" [value]="artist.Id">{{ artist.Value }}</mat-option>
            </mat-select>
          </mat-form-field>
  
          <button mat-raised-button color="primary" type="submit">Save</button>
        </form>
      </div>
    </div>
  </div>
