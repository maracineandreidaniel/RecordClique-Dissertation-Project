<body>

  <div class="track-list-wrapper">
    <div class="track-list shadow">
      <div class="track" *ngFor="let track of tracks">
        <div>{{ track.Title }}</div>
        <button (click)="togglePlayPause(track)">
          {{ currentTrack?.Id === track.Id && isPlaying ? '⏸ Pause' : '▶ Play' }}
        </button>
      </div>
    </div>
  </div>

  <div class="reviews">

    <div class="review-list-full">
      <div *ngFor="let review of reviews" class="review-line">
        <div class="left">
          <span class="commenter-name">{{review.UserName}}</span> 
          <div class="rating">
            <span *ngFor="let star of [].constructor(review.Rating)">★</span>
          </div>
          <p class="comment">{{ review.Comment }}</p>
        </div>

        <button mat-icon-button color="warn" data-bs-toggle="modal" data-bs-target="#deleteReviewModal"
          (click)="setSelectedReviewId(review.Id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>


    <div class="buttons">
      <div *ngIf="totalPages > 1">
        <ul class="pagination">
          <li class="page-item" *ngFor="let pageNum of [].constructor(totalPages); let i = index"
            [ngClass]="{'active': page === i + 1}">
            <a class="page-link" (click)="pageChange(i+1)">{{ i + 1 }}</a>
          </li>
        </ul>
      </div>

      <button class="add-review" mat-raised-button data-bs-toggle="modal" data-bs-target="#addReviewModal"
        color="primary">
        +
      </button>
    </div>

  </div>

</body>


<div class="modal fade" id="deleteReviewModal" tabindex="-1" aria-labelledby="deleteReviewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Delete Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-3">Are you sure you want to delete this review?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer border-0 d-flex justify-content-center">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteReview(selectedReviewId)">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="addReviewModal" tabindex="-1" aria-labelledby="addReviewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Add Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="closeAddModal()" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="addReviewForm" class="d-flex flex-column gap-3">
          <div class="text-center">
            <app-star-rating (ratingChange)="onStarSelected($event)"></app-star-rating>
            <p class="mt-2 mb-0">Selected Stars: {{ addReviewForm.value.rating }}</p>
          </div>

          <textarea formControlName="comment" class="form-control" rows="4" placeholder="Write your review..."></textarea>
          <p *ngIf="addReviewForm.controls['comment'].invalid && addReviewForm.controls['comment'].touched" class="text-danger small">
            Comment is required (min 5 characters).
          </p>
        </form>
      </div>

      <div class="modal-footer border-0 d-flex justify-content-center">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="closeAddModal()">Cancel</button>
        <button type="button" class="btn btn-primary" [disabled]="addReviewForm.invalid" (click)="addReview()">Add Review</button>
      </div>
    </div>
  </div>
</div>
