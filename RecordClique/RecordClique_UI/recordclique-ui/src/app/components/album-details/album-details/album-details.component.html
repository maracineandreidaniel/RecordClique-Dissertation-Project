  <body>

  <div class="track-list-wrapper">
    <div class="track-list shadow">
      <div class="track" *ngFor="let track of tracks">
        <div>{{ track.Title }}</div>
        <button (click)="togglePlayPause(track)">
          {{ currentTrack?.Id === track.Id && isPlaying ? '⏸ Pause' : '▶ Play' }}
        </button>
      </div>
    </div>
  </div>

<div class="reviews">
  <table class="table">
    <thead class="table-dark">
      <tr>
        <th>Comment</th>
        <th>Rating</th>
        <th></th>
      </tr>
    </thead>
    <tbody class="review-list">
      <tr *ngFor="let review of reviews">
        <td>{{ review.Comment }}</td>
        <td>
          <span *ngFor="let star of [].constructor(review.Rating); let i = index">
            ★
          </span>
        </td>
        <td>
          <button mat-raised-button data-bs-toggle="modal" data-bs-target="#deleteReviewModal" 
                  (click)="setSelectedReviewId(review.Id)" color="warn">
            <mat-icon>delete</mat-icon>Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <div *ngIf="totalPages > 0">
    <ul class="pagination">
      <li class="page-item" *ngFor="let pageNum of [].constructor(totalPages); let i = index"
           [ngClass]="{'active': page === i + 1}"> 
        <a class="page-link" (click)="pageChange(i+1)">{{ i + 1 }}</a>
      </li>
    </ul>
  </div>

  <button class="add-review" mat-raised-button data-bs-toggle="modal" data-bs-target="#addReviewModal" color="primary">
    +
    </button>

</div>

</body>


  <div class="modal fade" id="deleteReviewModal" tabindex="-1" aria-labelledby="deleteReviewModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <p class="modal-title" id="deleteReviewModal"><span style="font-size: 25px; font-weight: 700">Deleting
              Confirmation</span><br>
            <small> Are you sure you want to delete this review? </small>
          </p>
          <button type="button" (click)="closeDeleteModal()" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>If yes, press "Delete Review" button!</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="closeDeleteModal()">Close</button>
          <button type="button" (click)="deleteReview(selectedReviewId)" class="btn btn-primary" style="background-color: red" >Delete Album </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addReviewModal" tabindex="-1" aria-labelledby="addReviewModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <p class="modal-title" id="deleteReviewModal"><span style="font-size: 25px; font-weight: 700">Add Review
            </span><br>
          </p>
          <button type="button" (click)="closeAddModal()" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <form [formGroup]="addReviewForm">
            <app-star-rating (ratingChange)="onStarSelected($event)"></app-star-rating>
            <p>Selected Stars: {{ addReviewForm.value.rating }}</p>
          
            <textarea formControlName="comment" placeholder="Write your review..."></textarea>
            <p *ngIf="addReviewForm.controls['comment'].invalid && addReviewForm.controls['comment'].touched">
              Comment is required (min 5 characters).
            </p>
          </form>
          

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="closeAddModal()">Close</button>
          <button type="button" (click)="addReview()" class="btn btn-primary" [disabled]="addReviewForm.invalid" style="background-color: red" >Add Review </button>
        </div>
      </div>
    </div>
  </div>
