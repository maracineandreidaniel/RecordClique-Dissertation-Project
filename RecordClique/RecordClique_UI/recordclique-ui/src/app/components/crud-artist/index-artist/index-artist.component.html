<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous" />
  </head>

  <form class="form-inline" aform="ngForm" [formGroup]="searchArtistForm">
    <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" formControlName="filter">
    <button (click)="searchArtist()" class="btn btn-outline-success my-2 my-sm-0" type="button">Search</button>
  </form>
  
  <button class="btn btn-warning my-2 my-sm-0" type="button" data-bs-toggle="modal" data-bs-target="#filtersModal">
    <i class="bi bi-filter"></i>
  </button>
  <table class="table">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Biography</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody class="artists-list">
      <tr *ngFor="let artist of artists">
        <td>{{ artist.Name }}</td>
        <td>{{ artist.Biography }}</td>
        <td>
          <button mat-raised-button [routerLink]="['/artists/update', artist.Id]" style="background-color: orange">
            <mat-icon>edit</mat-icon>Edit
          </button>
        </td>
        <td>
          <button mat-raised-button data-bs-toggle="modal" data-bs-target="#deleteArtistModal" (click)="setSelectedArtistId(artist.Id)" color="warn">
            <mat-icon>delete</mat-icon>Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="totalPages > 0">
    <ul class="pagination">
      <li class="page-item" *ngFor="let pageNum of [].constructor(totalPages); let i = index"
           [ngClass]="{'active': page === i + 1}"> 
        <a class="page-link" (click)="pageChange(i+1)">{{ i + 1 }}</a>
      </li>
    </ul>
  </div>

  <div class="modal fade" id="deleteArtistModal" tabindex="-1" aria-labelledby="deleteArtistModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <p class="modal-title" id="deleteArtistModal"><span style="font-size: 25px; font-weight: 700">Deleting
              Confirmation</span><br>
            <small> Are you sure you want to delete this artist? </small>
          </p>
          <button type="button" (click)="closeDeleteModal()" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>If yes, press "Delete Artist" button!</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="closeDeleteModal()">Close</button>
          <button type="button" (click)="deleteArtist(selectedArtistId)" class="btn btn-primary" style="background-color: red" >Delete Screening </button>
        </div>
      </div>
    </div>
  </div>
