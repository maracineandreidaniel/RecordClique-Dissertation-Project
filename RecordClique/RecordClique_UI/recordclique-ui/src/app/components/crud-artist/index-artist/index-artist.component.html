<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous" />
</head>

<body>

  <form class="form-inline" aform="ngForm" [formGroup]="searchArtistForm">
    <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" formControlName="filter">
    <button (click)="searchArtist()" class="btn btn-outline-success my-2 my-sm-0" type="button"><i class="bi bi-search"></i></button>
  </form>

  <div class="container">
    <div class="row">
      <div class="col-md-3 mb-4" *ngFor="let artist of artists">
        <div class="card shadow-sm position-relative d-flex flex-column">

          <div class="image">
            <img [src]="artist.Picture" class="" alt="Artist Picture" *ngIf="artist.Picture">
          </div>

          <div class="data col-md-8">
            <h3 class="card-text card-title title">{{ artist.Name }}</h3>
            <p class="card-text biography">{{ artist.Biography }}</p>
            <div class="buttons">
              <button mat-raised-button [routerLink]="['/artists/update', artist.Id]" style="background-color: orange">
                <mat-icon>edit</mat-icon>Edit
              </button>
              <button mat-raised-button data-bs-toggle="modal" data-bs-target="#deleteArtistModal"
                (click)="setSelectedArtistId(artist.Id)" color="warn">
                <mat-icon>delete</mat-icon>Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="pagination-wrapper" *ngIf="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" *ngFor="let pageNum of [].constructor(totalPages); let i = index"
        [ngClass]="{'active': page === i + 1}">
        <a class="page-link" (click)="pageChange(i+1)">{{ i + 1 }}</a>
      </li>
    </ul>
  </div>

</body>

<div class="modal fade" id="deleteArtistModal" tabindex="-1" aria-labelledby="deleteArtistModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Delete Artist</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-3">Are you sure you want to delete this artist?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer border-0 d-flex justify-content-center">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteArtist(selectedArtistId)">Delete</button>
      </div>
    </div>
  </div>
</div>
