<div class="col-6">
    <form [formGroup]="assistantFormGroup" (ngSubmit)="displayText()" class="d-flex flex-column gap-3">
      <!-- Input Field -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Enter a Title</mat-label>
        <input matInput type="text" formControlName="message" placeholder="Type your title here">
      </mat-form-field>
  
      <!-- Submit Button -->
      <button mat-raised-button color="primary" type="submit" class="align-self-start">
        Generate Message
      </button>
    </form>
  
    <!-- Message Display Section -->
    <div *ngIf="generatedMessage" class="message-box mt-4">
      <mat-card>
        <mat-card-title>Generated Message</mat-card-title>
        <mat-card-content>
          <p>{{ generatedMessage }}</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
